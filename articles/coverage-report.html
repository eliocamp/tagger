<style>
  #cov-app {
    --cov-accent: var(--bs-success, #1a7f37);
    --cov-muted: var(--bs-secondary-color, #656d76);
    --cov-line: var(--bs-border-color, #d0d7de);
    --cov-bg: var(--bs-body-bg, #ffffff);
    --cov-panel: var(--bs-tertiary-bg, #f6f8fa);
  }
  #cov-app .cov-muted { color: var(--cov-muted); }
  #cov-app #cov-chart-wrap { position: relative; }
  #cov-app #cov-chart svg { width: 100%; height: auto; display: block; }
  #cov-app .cov-grid { stroke: var(--cov-line); stroke-width: 1; opacity: .6; }
  #cov-app .cov-axis { fill: var(--cov-muted); font-size: 11px; }
  #cov-app .cov-line { fill: none; stroke: var(--cov-accent); stroke-width: 2; }
  #cov-app .cov-pt { fill: var(--cov-bg); stroke: var(--cov-accent); stroke-width: 2; cursor: pointer; }
  #cov-app .cov-pt:hover, #cov-app .cov-pt:focus { fill: var(--cov-accent); outline: none; }
  #cov-app .cov-pt:focus-visible { outline: 2px solid var(--cov-accent); outline-offset: 2px; }
  #cov-app #cov-tip {
    position: absolute; pointer-events: none; display: none; white-space: nowrap;
    background: var(--cov-panel); border: 1px solid var(--cov-line); border-radius: 4px;
    padding: .35rem .6rem; font-size: .85rem; transform: translate(-50%, -100%);
  }
  #cov-app #cov-report {
    width: 100%; height: 80vh; display: none; background: #fff;
    border: 1px solid var(--cov-line); border-radius: 4px;
  }
</style>
<div id="cov-app">
  <p id="cov-summary" class="cov-muted">Loading history…</p>
  <div id="cov-chart-wrap">
    <div id="cov-chart"></div>
    <div id="cov-tip"></div>
  </div>
  <p class="cov-muted">Select a point to open that commit on GitHub.</p>

  <h2 id="cov-report-heading" style="font-size: 1.25rem; margin-top: 2rem;">Latest report</h2>
  <p id="cov-msg" class="cov-muted">Loading report…</p>
  <iframe id="cov-report" title="Coverage report" sandbox="allow-scripts"></iframe>
</div>

<script>
(function () {
  "use strict";

  // Set these two values for your repository.
  var REPO = "eliocamp/tagger";
  var BRANCH = "coverage";

  var RAW = "https://raw.githubusercontent.com/" + REPO + "/" + BRANCH;
  var NS = "http://www.w3.org/2000/svg";
  var q = function (id) { return document.getElementById(id); };

  function el(name, attrs, text) {
    var e = document.createElementNS(NS, name);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function fmtDate(d) {
    return new Date(d).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "2-digit" });
  }
  function fmtDateTime(d) { return new Date(d).toLocaleString(); }
  function commitUrl(sha) { return "https://github.com/" + REPO + "/commit/" + sha; }

  async function loadHistory() {
    try {
      var res = await fetch(RAW + "/history.json", { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      var data = await res.json();
      if (!Array.isArray(data) || data.length === 0) throw new Error("history.json is empty");
      data.sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
      renderSummary(data[data.length - 1]);
      renderChart(data);
    } catch (e) {
      q("cov-summary").textContent = "Could not load coverage history (" + e.message + "). Check that the repository is public and the " + BRANCH + " branch exists.";
    }
  }

  function renderSummary(last) {
    var s = q("cov-summary");
    s.textContent = "";
    var strong = document.createElement("strong");
    strong.textContent = last.percent.toFixed(2) + "%";
    var a = document.createElement("a");
    a.href = commitUrl(last.sha);
    a.textContent = last.sha.slice(0, 7);
    s.append("Latest: ", strong, " at ", a, " on " + fmtDateTime(last.date));
  }

  function renderChart(data) {
    var W = 800, H = 320, m = { l: 44, r: 16, t: 16, b: 32 };
    var iw = W - m.l - m.r, ih = H - m.t - m.b;
    var vals = data.map(function (d) { return d.percent; });
    var lo = Math.max(0, Math.floor((Math.min.apply(null, vals) - 5) / 5) * 5);
    var hi = Math.min(100, Math.max(lo + 10, Math.ceil((Math.max.apply(null, vals) + 2) / 5) * 5));
    var x = function (i) { return m.l + (data.length === 1 ? iw / 2 : (i * iw) / (data.length - 1)); };
    var y = function (v) { return m.t + ih - ((v - lo) / (hi - lo)) * ih; };

    var svg = el("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Test coverage over time" });

    var step = hi - lo <= 20 ? 5 : 10;
    for (var v = lo; v <= hi; v += step) {
      svg.append(el("line", { "class": "cov-grid", x1: m.l, x2: W - m.r, y1: y(v), y2: y(v) }));
      svg.append(el("text", { "class": "cov-axis", x: m.l - 8, y: y(v) + 4, "text-anchor": "end" }, v + "%"));
    }

    var nTicks = Math.min(data.length, 6), seen = {};
    for (var t = 0; t < nTicks; t++) {
      var i = nTicks === 1 ? 0 : Math.round((t * (data.length - 1)) / (nTicks - 1));
      if (seen[i]) continue;
      seen[i] = true;
      svg.append(el("text", { "class": "cov-axis", x: x(i), y: H - 10, "text-anchor": "middle" }, fmtDate(data[i].date)));
    }

    if (data.length > 1) {
      var d = data.map(function (p, i) { return (i ? "L" : "M") + x(i) + "," + y(p.percent); }).join(" ");
      svg.append(el("path", { "class": "cov-line", d: d }));
    }

    var tip = q("cov-tip"), wrap = q("cov-chart-wrap");
    data.forEach(function (p, i) {
      var link = el("a", { href: commitUrl(p.sha), target: "_blank", rel: "noopener" });
      var c = el("circle", { "class": "cov-pt", cx: x(i), cy: y(p.percent), r: 5, tabindex: 0 });
      link.append(c);
      function show() {
        var cb = c.getBoundingClientRect(), wb = wrap.getBoundingClientRect();
        tip.textContent = p.percent.toFixed(2) + "% · " + p.sha.slice(0, 7) + " · " + fmtDateTime(p.date);
        tip.style.left = (cb.left - wb.left + cb.width / 2) + "px";
        tip.style.top = (cb.top - wb.top - 8) + "px";
        tip.style.display = "block";
      }
      function hide() { tip.style.display = "none"; }
      c.addEventListener("mouseenter", show);
      c.addEventListener("focus", show);
      c.addEventListener("mouseleave", hide);
      c.addEventListener("blur", hide);
      svg.append(link);
    });

    q("cov-chart").replaceChildren(svg);
  }

  // The raw host serves HTML as text, so load it into the iframe via srcdoc.
  async function loadReport() {
    var msg = q("cov-msg"), frame = q("cov-report");
    try {
      var res = await fetch(RAW + "/report.html", { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      frame.srcdoc = await res.text();
      frame.style.display = "block";
      msg.style.display = "none";
    } catch (e) {
      msg.textContent = "Could not load the report (" + e.message + ").";
    }
  }

  loadHistory();
  loadReport();
})();
</script></main>
