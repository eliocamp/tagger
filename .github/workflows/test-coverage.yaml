on:
  push:
    branches: [main, master]

name: test-coverage

# One run at a time, so pushes to the coverage branch cannot race.
concurrency:
  group: test-coverage
  cancel-in-progress: false

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::DT, any::htmltools, any::rmarkdown, any::jsonlite
          needs: coverage

      - name: Check out coverage branch into ./coverage
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if git ls-remote --exit-code --heads origin coverage > /dev/null 2>&1; then
            git fetch origin coverage
            git worktree add -B coverage coverage origin/coverage
          else
            git worktree add --detach coverage
            git -C coverage checkout --orphan coverage
            git -C coverage rm -rf . > /dev/null || true
          fi

      - name: Run coverage
        run: Rscript .github/scripts/coverage.R

      - name: Push coverage branch
        run: |
          cd coverage
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update coverage (${GITHUB_SHA:0:7})"
            git push origin coverage
          else
            echo "No changes to commit."
          fi
